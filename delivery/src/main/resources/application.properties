spring.application.name=delivery

# Servidor
server.port=${PORT:8088}

# MySQL DataSource
# Nota: En este entorno de laboratorio local el usuario IN5AM tiene permisos sobre delivery_in5am
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/delivery_in5am?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:IN5AM}
spring.datasource.password=${DB_PASSWORD:_odmon5Am}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration
jwt.secret=${JWT_SECRET:DeliverySuperSecretKeyForJWTGeneration2025353KinalAppAuthSecretKeyHere!}
jwt.expiration=86400000
